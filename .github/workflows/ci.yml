name: macOS Build & Stress Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AI Pulse.app
        run: |
          chmod +x ./build.sh
          ./build.sh

      - name: Run Automated Stress Test Suite
        run: |
          "./AI Pulse.app/Contents/MacOS/AIPulse" --stress-test
